# Deploys one environment from the artifacts produced by the Build stage.
# Used by the Dev, Staging and Prod stages in azure-pipelines.yml - keep environments identical
# by changing this file, not by copy-pasting steps into a stage.
#
# Expects these variables (from the stage's variable group, ideally Key Vault-linked):
#   appServicePrefix, resourceGroupName, sqlServerName, sqlDatabaseName,
#   storageAccountName, blobContainer
# With canary.enabled also: appInsightsName, appInsightsResourceGroup (Application Insights
# of the Web app). See docs/pipeline/setup.md for the Azure roles the service connection needs.
parameters:
- name: environment
  type: string
- name: serviceConnection          # ARM service connection, workload identity federation
  type: string
- name: webApps
  type: object
- name: vmImage
  type: string
- name: dacpacName                 # dacpac file name without extension
  type: string
- name: ninjectProfile             # picks App_Data/ninjectModules.<profile>.xml
  type: string
  default: Release
- name: useStagingSlot
  type: boolean
  default: false
- name: healthPath
  type: string
  default: /
# Canary release for slot apps (only meaningful with useStagingSlot). For each percentage in
# `steps`, that share of users is routed to the staging slot for `stepMinutes` while the slot's
# health and the Application Insights failed-request rate are checked. Any failure routes all
# traffic back to the current production version and fails the run. After the last step: swap.
- name: canary
  type: object
  default:
    enabled: false
    steps: [ 10, 50 ]
    stepMinutes: 10
    maxFailedRequestPercent: 2       # failed-request rate (%) on the canary that triggers rollback
    minRequests: 50                  # fewer canary requests than this = not enough data; health probe only
    requestFilter: "cloud_RoleName has 'staging'"   # KQL filter selecting the canary slot's requests

jobs:
- deployment: Deploy
  displayName: Deploy to ${{ parameters.environment }}
  environment: ${{ parameters.environment }}
  ${{ if eq(parameters.canary.enabled, true) }}:
    timeoutInMinutes: 180            # deploys + canary hold time
  ${{ else }}:
    timeoutInMinutes: 60
  pool:
    vmImage: ${{ parameters.vmImage }}   # Windows required: SqlAzureDacpacDeployment is Windows-only
  strategy:
    runOnce:
      deploy:
        # Deployment jobs download all pipeline artifacts to $(Pipeline.Workspace)/<artifact>.
        steps:
        # 1. Schema first. Changes must be backward compatible (expand/contract),
        #    because the old app version keeps running until the swap.
        - task: SqlAzureDacpacDeployment@1
          displayName: Database schema (dacpac)
          inputs:
            azureSubscription: ${{ parameters.serviceConnection }}
            AuthenticationType: servicePrincipal
            ServerName: $(sqlServerName).database.windows.net
            DatabaseName: $(sqlDatabaseName)
            deployType: DacpacTask
            DeploymentAction: Publish
            DacpacFile: $(Pipeline.Workspace)/database/${{ parameters.dacpacName }}.dacpac
            AdditionalArguments: /p:BlockOnPossibleDataLoss=true

        # 2. Static blob assets, Entra ID auth instead of storage keys.
        - task: AzureCLI@2
          displayName: Upload blob assets
          inputs:
            azureSubscription: ${{ parameters.serviceConnection }}
            scriptType: pscore
            scriptLocation: inlineScript
            inlineScript: >-
              az storage blob upload-batch
              --account-name $(storageAccountName)
              --destination $(blobContainer)
              --source "$(Pipeline.Workspace)/blob"
              --auth-mode login --overwrite --only-show-errors

        # 3. Apps: select environment config, deploy (to staging slot in prod).
        - ${{ each app in parameters.webApps }}:
          - pwsh: |
              $dir = "$(Pipeline.Workspace)/web/${{ app.name }}/App_Data"
              Copy-Item "$dir/ninjectModules.${{ parameters.ninjectProfile }}.xml" "$dir/ninjectModules.xml" -Force -ErrorAction Stop
            displayName: ${{ app.name }} - select ninject profile '${{ parameters.ninjectProfile }}'

          - task: AzureWebApp@1
            displayName: Deploy ${{ app.name }}
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              appType: webApp
              appName: $(appServicePrefix)-${{ lower(app.name) }}
              ${{ if and(parameters.useStagingSlot, eq(app.slotSwap, true)) }}:
                deployToSlotOrASE: true
                resourceGroupName: $(resourceGroupName)
                slotName: staging
              package: $(Pipeline.Workspace)/web/${{ app.name }}
              deploymentMethod: zipDeploy   # not runFromPackage: legacy apps may write to App_Data

          # Smoke test after every deploy, in every environment, for apps with smokeTest: true.
          # Apps that use the slot are always tested on the slot BEFORE the swap.
          # The real host name comes from Azure (apps with "unique default hostname" don't
          # follow <app>.azurewebsites.net). Redirects are not followed, so a redirect to a
          # login page counts as a failure.
          - ${{ if or(eq(app.smokeTest, true), and(parameters.useStagingSlot, eq(app.slotSwap, true))) }}:
            - task: AzureCLI@2
              ${{ if and(parameters.useStagingSlot, eq(app.slotSwap, true)) }}:
                displayName: ${{ app.name }} - smoke test staging slot
              ${{ else }}:
                displayName: ${{ app.name }} - smoke test
              env:
                ${{ if and(parameters.useStagingSlot, eq(app.slotSwap, true)) }}:
                  SMOKE_SLOT: staging
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: pscore
                scriptLocation: inlineScript
                inlineScript: |
                  $slotArgs = @(); if ($env:SMOKE_SLOT) { $slotArgs = @('--slot', $env:SMOKE_SLOT) }
                  $hostName = az webapp show --resource-group "$(resourceGroupName)" --name "$(appServicePrefix)-${{ lower(app.name) }}" @slotArgs --query defaultHostName -o tsv
                  if ($LASTEXITCODE -ne 0 -or -not $hostName) { Write-Error "Could not resolve host name"; exit 1 }
                  $url = "https://$hostName${{ parameters.healthPath }}"
                  foreach ($i in 1..10) {
                    try {
                      $r = Invoke-WebRequest $url -UseBasicParsing -TimeoutSec 30 -MaximumRedirection 0 -SkipHttpErrorCheck
                      Write-Host "Attempt ${i}: HTTP $($r.StatusCode)"
                      if ($r.StatusCode -eq 200) { exit 0 }
                    } catch { Write-Host "Attempt ${i}: $($_.Exception.Message)" }
                    Start-Sleep -Seconds 15
                  }
                  Write-Error "Smoke test failed: $url"
                  exit 1

          # Canary: ramp real users onto the staging slot step by step, then swap.
          - ${{ if and(parameters.useStagingSlot, eq(app.slotSwap, true), eq(parameters.canary.enabled, true)) }}:
            - ${{ each pct in parameters.canary.steps }}:
              - task: AzureCLI@2
                displayName: ${{ app.name }} - canary ${{ pct }}% for ${{ parameters.canary.stepMinutes }} min
                inputs:
                  azureSubscription: ${{ parameters.serviceConnection }}
                  scriptType: pscore
                  scriptLocation: inlineScript
                  inlineScript: |
                    $rg  = "$(resourceGroupName)"
                    $app = "$(appServicePrefix)-${{ lower(app.name) }}"
                    function Rollback([string]$reason) {
                      az webapp traffic-routing clear -g $rg -n $app --only-show-errors | Out-Null
                      Write-Host "##vso[task.logissue type=error]Canary rolled back at ${{ pct }}%: $reason. All traffic is on the previous version; nothing was swapped."
                      exit 1
                    }

                    az webapp traffic-routing set -g $rg -n $app --distribution staging=${{ pct }} --only-show-errors | Out-Null
                    if ($LASTEXITCODE -ne 0) { Rollback "could not set traffic routing" }
                    Write-Host "Routing ${{ pct }}% of users to the staging slot for ${{ parameters.canary.stepMinutes }} minutes."

                    # 1. Health probe on the slot every 30 s; 3 failures in a row = rollback.
                    $hostName = az webapp show -g $rg -n $app --slot staging --query defaultHostName -o tsv
                    $url = "https://$hostName${{ parameters.healthPath }}"
                    $end = (Get-Date).AddMinutes(${{ parameters.canary.stepMinutes }}); $bad = 0
                    while ((Get-Date) -lt $end) {
                      $code = 0
                      try { $code = (Invoke-WebRequest $url -UseBasicParsing -TimeoutSec 30 -MaximumRedirection 0 -SkipHttpErrorCheck).StatusCode } catch {}
                      if ($code -eq 200) { $bad = 0 } else { $bad++; Write-Host "Health probe: HTTP $code ($bad in a row)" }
                      if ($bad -ge 3) { Rollback "health probe failed 3 times in a row ($url)" }
                      Start-Sleep -Seconds 30
                    }

                    # 2. Failed-request rate of the canary from Application Insights.
                    $ai = "$(appInsightsName)"; $aiRg = "$(appInsightsResourceGroup)"
                    if (-not $ai -or $ai.StartsWith('$(')) {
                      Write-Host "##vso[task.logissue type=warning]appInsightsName not set; canary judged by the health probe only."
                      exit 0
                    }
                    az extension add --name application-insights --only-show-errors 2>$null
                    $kql = "requests | where timestamp > ago(${{ parameters.canary.stepMinutes }}m) | where ${{ parameters.canary.requestFilter }} | summarize total = count(), failed = countif(success == false)"
                    $res = az monitor app-insights query --app $ai -g $aiRg --analytics-query $kql -o json | ConvertFrom-Json
                    if ($LASTEXITCODE -ne 0 -or -not $res) { Rollback "could not query Application Insights" }
                    $total = [int]$res.tables[0].rows[0][0]; $failed = [int]$res.tables[0].rows[0][1]
                    if ($total -lt ${{ parameters.canary.minRequests }}) {
                      Write-Host "##vso[task.logissue type=warning]Only $total canary requests in the window (minimum ${{ parameters.canary.minRequests }}); judged by the health probe only. Check canary.requestFilter if this is always 0."
                      exit 0
                    }
                    $rate = [math]::Round(100.0 * $failed / $total, 2)
                    Write-Host "Canary: $failed failed of $total requests ($rate%), limit ${{ parameters.canary.maxFailedRequestPercent }}%."
                    if ($rate -gt ${{ parameters.canary.maxFailedRequestPercent }}) { Rollback "failed-request rate $rate% is above ${{ parameters.canary.maxFailedRequestPercent }}%" }

          # Clear routing BEFORE the swap: after a swap the slot holds the OLD version, so any
          # remaining routing would send users back to it.
          - ${{ if and(parameters.useStagingSlot, eq(app.slotSwap, true)) }}:
            - task: AzureCLI@2
              displayName: ${{ app.name }} - reset traffic routing
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: pscore
                scriptLocation: inlineScript
                inlineScript: az webapp traffic-routing clear -g "$(resourceGroupName)" -n "$(appServicePrefix)-${{ lower(app.name) }}" --only-show-errors

            - task: AzureAppServiceManage@0
              displayName: ${{ app.name }} - swap staging -> production
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                Action: Swap Slots
                WebAppName: $(appServicePrefix)-${{ lower(app.name) }}
                ResourceGroupName: $(resourceGroupName)
                SourceSlot: staging

        # Safety net: if anything failed or the run was cancelled mid-canary, make sure no
        # users stay routed to the staging slot.
        - ${{ if eq(parameters.canary.enabled, true) }}:
          - ${{ each app in parameters.webApps }}:
            - ${{ if and(parameters.useStagingSlot, eq(app.slotSwap, true)) }}:
              - task: AzureCLI@2
                displayName: ${{ app.name }} - clear traffic routing (on failure)
                condition: or(failed(), canceled())
                inputs:
                  azureSubscription: ${{ parameters.serviceConnection }}
                  scriptType: pscore
                  scriptLocation: inlineScript
                  inlineScript: az webapp traffic-routing clear -g "$(resourceGroupName)" -n "$(appServicePrefix)-${{ lower(app.name) }}" --only-show-errors
