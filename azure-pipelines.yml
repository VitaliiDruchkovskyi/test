# BenefitNetFlex - build once, deploy many
#
# Branching (Release Flow, see docs/pipeline/branching.md):
#   feature/*, bugfix/*  -> PR into main   -> Build only (validation)
#   main                 -> Build -> Development
#   release/*            -> Build -> Staging -> Production (approval) -> git tag prod/<build>
#
# Docs: docs/pipeline/README.md (how it works), docs/pipeline/branching.md (git strategy),
# docs/pipeline/setup.md (one-time setup), docs/pipeline/runbook.md (operations).
#
# PR validation: Azure Repos ignores the YAML `pr:` keyword. Add a "Build validation"
# branch policy on main and on release/* that points at this pipeline.
# On PR runs only the Build stage runs.
#
# Approvals / business-hours / exclusive-lock checks live on the Environments
# (Pipelines > Environments > benefitnetflex-<env> > Approvals and checks), not in YAML.

name: $(Date:yyyy.MM.dd)$(Rev:.r)

trigger:
  batch: true                       # don't queue one run per push during busy merges
  branches:
    include: [ main, release/* ]
  paths:
    exclude: [ '**/*.md', docs/** ]

parameters:
# One entry per deployable ASP.NET app. App Service name = <appServicePrefix>-<lower(name)>
# slotSwap: false for background workers, so two copies never process jobs at the same time.
- name: webApps
  type: object
  default:
  - name: Web
    project: src/BenefitNetFlex/BenefitNetFlex.Web/BenefitNetFlex.Web.csproj
    slotSwap: true
  - name: BulkOperationWorker
    project: src/BenefitNetFlex/BenefitNetFlex.BulkOperationWorker/BenefitNetFlex.BulkOperationWorker.csproj
    slotSwap: false
  - name: MaintenanceWorker
    project: src/BenefitNetFlex/BenefitNetFlex.MaintenanceWorker/BenefitNetFlex.MaintenanceWorker.csproj
    slotSwap: false

variables:
  solution: src/BenefitNetFlex/BenefitNetFlex.sln
  dbSolution: src/BenefitNetFlex.DataBase/BenefitNetFlex.DataBase.sln
  dacpacName: BenefitNetFlex.DataBase      # file name (without .dacpac) of the database to deploy
  buildConfiguration: Release
  vmImage: windows-2025             # pinned on purpose; bump deliberately, not via windows-latest
  # main or release/*, and not a PR build. Gates symbol publishing; stage conditions route by branch.
  isDeployable: $[and(or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')), ne(variables['Build.Reason'], 'PullRequest'))]

stages:
# ---------------------------------------------------------------- BUILD
- stage: Build
  jobs:
  - job: App
    displayName: Build, test & publish web apps
    pool:
      vmImage: ${{ variables.vmImage }}
    steps:
    - checkout: self
      fetchDepth: 1

    # Authenticated restore from the Azure Artifacts feed in /nuget.config (nuget.org as upstream).
    - template: templates/nuget-restore.yml
      parameters:
        solution: $(solution)
        nugetConfigPath: nuget.config
        packagesDirectory: $(Build.SourcesDirectory)/src/BenefitNetFlex/packages
        cacheKeyFiles: src/BenefitNetFlex/**/packages.config
        nuGetServiceConnections: ''    # e.g. 'sc-nuget-vendor' for an external feed needing credentials

    # Plain compile of the whole solution. No packaging, no config swapping here.
    - task: VSBuild@1
      displayName: Build solution
      inputs:
        solution: $(solution)
        platform: Any CPU
        configuration: $(buildConfiguration)
        maximumCpuCount: true
        msbuildArgs: /bl:$(Build.ArtifactStagingDirectory)/logs/build.binlog

    # Tests run before anything is packaged; a red test stops the run.
    - task: VSTest@2
      displayName: Unit tests
      inputs:
        testSelector: testAssemblies
        testAssemblyVer2: |
          **\bin\$(buildConfiguration)\**\*Tests.dll
          !**\obj\**
          !**\packages\**
        searchFolder: $(Build.SourcesDirectory)/src
        configuration: $(buildConfiguration)
        codeCoverageEnabled: true
        failOnMinTestsNotRun: true
        minimumExpectedTests: 1

    # Real symbol publishing (Azure Artifacts symbol server), only for deployable builds.
    # Runs before the publish steps so the source-indexed PDBs end up in the app folders.
    - task: PublishSymbols@2
      displayName: Index & publish symbols
      condition: and(succeeded(), eq(variables.isDeployable, 'true'))
      inputs:
        SymbolsFolder: $(Build.SourcesDirectory)/src
        SearchPattern: '**/bin/**/BenefitNetFlex*.pdb'
        IndexSources: true
        PublishSymbols: true
        SymbolServerType: TeamServices

    # Publish each app to its own folder. Project-level builds use "AnyCPU" (no space).
    # All ninjectModules.*.xml variants ship; the right one is chosen at deploy time.
    - ${{ each app in parameters.webApps }}:
      - task: VSBuild@1
        displayName: Publish ${{ app.name }}
        inputs:
          solution: ${{ app.project }}
          platform: AnyCPU
          configuration: $(buildConfiguration)
          msbuildArgs: >-
            /p:DeployOnBuild=true
            /p:WebPublishMethod=FileSystem
            /p:publishUrl="$(Build.ArtifactStagingDirectory)\web\${{ app.name }}"
            /p:DeleteExistingFiles=true
            /p:BuildProjectReferences=false
            /p:PrecompileBeforePublish=true
            /p:EnableUpdateable=true
            /p:WDPMergeOption=MergeAllPagesAndControlToASingleAssembly
            /p:UseMerge=true
            /p:ContentAssemblyName=PagesAndControls

    - task: PublishPipelineArtifact@1
      displayName: Publish artifact 'web'
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/web
        artifact: web

    - task: PublishPipelineArtifact@1
      displayName: Publish build logs (on failure)
      condition: failed()
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/logs
        artifact: logs-$(System.JobAttempt)

  - job: Database
    displayName: Build database & static assets
    pool:
      vmImage: ${{ variables.vmImage }}
    steps:
    - checkout: self
      fetchDepth: 1

    - task: VSBuild@1
      displayName: Build database project (dacpac)
      inputs:
        solution: $(dbSolution)
        platform: Any CPU
        configuration: $(buildConfiguration)

    # Ship the compiled dacpacs (the main one plus any it references) and publish
    # profiles, not the whole source folder. The deploy step targets $(dacpacName) only.
    - task: CopyFiles@2
      displayName: Collect dacpac & publish profiles
      inputs:
        SourceFolder: $(Build.SourcesDirectory)/src/BenefitNetFlex.DataBase
        Contents: |
          **/bin/$(buildConfiguration)/*.dacpac
          **/*.publish.xml
        TargetFolder: $(Build.ArtifactStagingDirectory)/database
        flattenFolders: true

    - pwsh: |
        $file = "$(Build.ArtifactStagingDirectory)/database/$(dacpacName).dacpac"
        if (-not (Test-Path $file)) { Write-Error "Expected dacpac not found: $file. Check the dacpacName variable."; exit 1 }
      displayName: Verify ${{ variables.dacpacName }}.dacpac exists

    - task: PublishPipelineArtifact@1
      displayName: Publish artifact 'database'
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/database
        artifact: database

    - task: PublishPipelineArtifact@1
      displayName: Publish artifact 'blob'
      inputs:
        targetPath: $(Build.SourcesDirectory)/blob
        artifact: blob

# ---------------------------------------------------------------- DEPLOY
# main      -> Dev
# release/* -> Staging -> Prod -> tag
# Each stage also has a "Branch control" check on its Environment as a second line of
# defence (see docs/pipeline/setup.md), so editing these conditions alone can't reach Prod.

- stage: Dev
  displayName: Development
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
  variables:
  - group: benefitnetflex-dev        # appServicePrefix, resourceGroupName, sqlServerName, sqlDatabaseName, storageAccountName, blobContainer
  jobs:
  - template: templates/deploy-environment.yml
    parameters:
      environment: benefitnetflex-dev
      serviceConnection: sc-benefitnetflex-dev
      webApps: ${{ parameters.webApps }}
      vmImage: ${{ variables.vmImage }}
      dacpacName: ${{ variables.dacpacName }}
      ninjectProfile: Release        # change to e.g. Dev once App_Data/ninjectModules.Dev.xml exists

- stage: Staging
  displayName: Staging
  dependsOn: Build
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), ne(variables['Build.Reason'], 'PullRequest'))
  variables:
  - group: benefitnetflex-staging
  jobs:
  - template: templates/deploy-environment.yml
    parameters:
      environment: benefitnetflex-staging
      serviceConnection: sc-benefitnetflex-staging
      webApps: ${{ parameters.webApps }}
      vmImage: ${{ variables.vmImage }}
      dacpacName: ${{ variables.dacpacName }}
      ninjectProfile: Release

- stage: Prod
  displayName: Production
  dependsOn: Staging
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), ne(variables['Build.Reason'], 'PullRequest'))
  variables:
  - group: benefitnetflex-prod
  jobs:
  - template: templates/deploy-environment.yml
    parameters:
      environment: benefitnetflex-prod
      serviceConnection: sc-benefitnetflex-prod
      webApps: ${{ parameters.webApps }}
      vmImage: ${{ variables.vmImage }}
      dacpacName: ${{ variables.dacpacName }}
      ninjectProfile: Release
      useStagingSlot: true
      healthPath: /                  # must return 200 anonymously, without a redirect (see runbook)

  # Mark exactly what is in production: annotated tag prod/<build number> on the built commit.
  # Needs "Contribute" and "Create tag" for the build service identity on the repo (setup.md).
  - job: TagRelease
    displayName: Tag released commit
    dependsOn: Deploy
    pool:
      vmImage: ${{ variables.vmImage }}
    steps:
    - checkout: self
      fetchDepth: 1
      persistCredentials: true

    - pwsh: |
        $tag = "prod/$(Build.BuildNumber)"
        git -c user.name="Azure Pipelines" -c user.email="azure-pipelines@noreply.local" `
          tag -a $tag "$(Build.SourceVersion)" -m "Released to production from $(Build.SourceBranchName), run $(Build.BuildNumber)"
        if ($LASTEXITCODE -ne 0) { exit 1 }
        git push origin "refs/tags/$tag"
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Write-Host "##vso[build.addbuildtag]released-to-prod"
      displayName: Tag commit prod/<build number>
